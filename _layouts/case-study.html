<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | SEO Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="/case-studies/favicon.svg?v=2">
  <meta name="description" content="{{ page.description | escape }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} | SEO Portfolio">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image:src" content="{{ page.social_image | default: site.social_image }}">

  <!-- Facebook OpenGraph -->
  <meta property="og:title" content="{{ page.title }} | SEO Portfolio">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:image" content="{{ page.social_image | default: site.social_image }}">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Ionicons -->
  <script defer type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script defer nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>


  <link rel="stylesheet" href="/case-studies/assets/main.css?v=2">
</head>

<body>

    

    <!-- begin header -->
<header class="c-header">
  <div class="container">
    <div class="row">
      <div class="c-header__inner">

        <nav class="main-nav">
          <div class="main-nav__box">

            <div class="nav__icon-close">
              <ion-icon class="nav-icon-close" name="close"></ion-icon>
            </div>

            <div class="nav__title">Menu</div>

              <ul class="nav__list list-reset">

              
                
                <li class="nav__item">
                  <a href="/case-studies/" class="nav__link">Home</a>
                </li>
                
              
                
                <li class="nav__item">
                  <a href="/case-studies/projects/" class="nav__link">Portfolio</a>
                </li>
                
              

            </ul>
          </div>

          <!--bookshop-live meta(version="3.16.5" baseurl="/view-portfolio-edits" title="SEO") -->
<!--bookshop-live name(social-link.jekyll.html) params() context() -->

<div class="social">
  <ul class="social__list list-reset">
    
    <li class="social__item">
      <a class="social__link" href="https://twitter.com" target="_blank" rel="noopener" aria-label="twitter icon"><ion-icon name="logo-twitter"></ion-icon></a>
    </li>
    
    <li class="social__item">
      <a class="social__link" href="https://github.com" target="_blank" rel="noopener" aria-label="github icon"><ion-icon name="logo-github"></ion-icon></a>
    </li>
    
    <li class="social__item">
      <a class="social__link" href="https://pinterest.com" target="_blank" rel="noopener" aria-label="pinterest icon"><ion-icon name="logo-pinterest"></ion-icon></a>
    </li>
    
    <li class="social__item">
      <a class="social__link" href="https://youtube.com" target="_blank" rel="noopener" aria-label="youtube icon"><ion-icon name="logo-youtube"></ion-icon></a>
    </li>
    
  </ul>
</div>

<!--bookshop-live end-->
        </nav>

        <div class="nav-button">
          <ion-icon class="nav__icon-menu" name="menu-outline"></ion-icon>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- end header -->

    <div class="container">

  <a href="/case-studies/"
     class="c-button c-button--secondary c-button--small"
     style="margin-top: 28px;">
    ← Back
  </a>

  <!--bookshop-live meta(version="3.16.5" baseurl="/view-portfolio-edits" title="SEO") -->
<!--bookshop-live name(page-heading/page-heading.jekyll.html) params(title=page.title description=page.subtitle) context() -->

<div class="container">
  <div class="c-page-heading">
    <h1 class="c-page-heading__title">{{ page.title }}</h1>
    
      {% if page.subtitle %}
      <p class="c-page-heading__description">{{ page.subtitle }}</p>
      {% endif %}
    
  </div>
</div>
<!--bookshop-live end-->

  

  <div class="page animate">
    {{ content }}
  </div>

  

</div>


    <!--
        Bookshop components are accessed using the bookshop tag,
        using the same syntax as the standard Jekyll include tag.
    -->
    <!--bookshop-live meta(version="3.16.5" baseurl="/view-portfolio-edits" title="SEO") -->
<!--bookshop-live name(page.jekyll.html) params(content_blocks=page.content_blocks page_theme=page.page_theme) context() -->

<!--bookshop-live end-->

    <div class="top" title="Top"><ion-icon name="arrow-up"></ion-icon></div>

    <script src="/case-studies/js/scripts.js"></script>
    <script src="/case-studies/js/common.js"></script>
</body>
</html>
